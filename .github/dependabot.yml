version: 2
# Обновления идут в dev; в main попадают сквошем вместе с остальной работой.
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin-and-agp:
        patterns: ["org.jetbrains.kotlin*", "com.android.*"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
